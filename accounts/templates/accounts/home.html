{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/role_badges.css' %}">
<div class="card shadow-sm mt-3">
    <div class="card-body">
        <h2 class="card-title">Welcome, {{ request.user.username }}!</h2>
        <p>Your role: 
            <span class="badge 
                {% if user_obj.role == 'admin' %}role-badge-admin
                {% elif user_obj.role == 'manager' %}role-badge-manager
                {% else %}role-badge-employee
                {% endif %}
            ">
                {{ user_obj.role|title }}
            </span>
        </p>
        <p>Your department: {{ request.user.department }}</p>
        <p class="mt-3 fw-semibold fs-5">Available Vehicles: <span class="text-success">{{ available_vehicles_count }}</span></p>
    </div>
</div>
{% endblock %}
