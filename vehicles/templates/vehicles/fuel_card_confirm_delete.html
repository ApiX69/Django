{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Confirm Delete Fuel Card</h2>
    <p>Are you sure you want to delete the fuel card with ID "{{ fuel_type.id }}" and type "{{ fuel_type.type }}"?</p>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'fuel_card_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div>
{% endblock %}
