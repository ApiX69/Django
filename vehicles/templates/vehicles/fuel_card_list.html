{% extends "base.html" %}

{% block content %}
<div class="w-full mt-4 px-4">
    <div class="card shadow p-4 rounded-4 animate__animated animate__fadeInDown">
        <h2 class="mb-4 fw-bold">Fuel Cards List</h2>
        <a href="{% url 'fuel_card_create' %}" class="btn btn-primary btn-lg mb-3 animate__animated animate__pulse animate__infinite animate__slow">Add New Fuel Card</a>
        <div class="table-responsive">
            <table class="table table-striped align-middle" style="table-layout: fixed; width: 100%;">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Balance</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for fuel_card in fuel_cards %}
                    <tr class="align-middle">
                        <td class="px-3 py-2">{{ fuel_card.id }}</td>
                        <td class="px-3 py-2">{{ fuel_card.balance }}</td>
                        <td class="px-3 py-2">{{ fuel_card.type }}</td>
                        <td class="px-3 py-2">
                            <a href="{% url 'fuel_card_edit' fuel_card.pk %}" class="btn btn-sm btn-warning">Edit</a>
                            <a href="{% url 'fuel_card_delete' fuel_card.pk %}" class="btn btn-sm btn-danger">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">No fuel cards found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
