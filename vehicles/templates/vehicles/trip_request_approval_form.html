{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Approve Mission Request</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        <p>
            <label for="id_vehicle">Assign Vehicle:</label>
            {{ form.vehicle }}
        </p>
        <p>
            <label for="id_fuel_consumed">Fuel to be Consumed:</label>
            {{ form.fuel_consumed }}
        </p>
        <button type="submit" class="btn btn-primary">Approve</button>
        <a href="{% url 'trip_request_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
