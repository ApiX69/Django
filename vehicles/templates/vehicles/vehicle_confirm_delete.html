{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Confirm Delete Vehicle</h2>
    <p>Are you sure you want to delete the vehicle "{{ vehicle }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'vehicle_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
