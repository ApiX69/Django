{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Confirm Delete Fuel Type</h2>
    <p>Are you sure you want to delete the fuel type "{{ fuel_type.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'fuel_type_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div>
{% endblock %}
