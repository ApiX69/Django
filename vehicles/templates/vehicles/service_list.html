{% extends "base.html" %}
{% block title %}Services List{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Services</h1>
<a href="{% url 'service_create' %}" class="btn btn-primary mb-3">Add New Service</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for service in services %}
        <tr>
            <td>{{ service.name }}</td>
            <td>
                <a href="{% url 'service_update' service.pk %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'service_delete' service.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No services found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
