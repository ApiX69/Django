{% extends "base.html" %}
{% block title %}Services List{% endblock %}

{% block content %}
<div class="container mt-4 px-3">
    <div class="card shadow p-4 rounded-4 animate__animated animate__fadeInDown">
        <h2 class="mb-4 fw-bold text-center text-primary">🛠️ Services</h2>

        <!-- Add New Service Button -->
        <div class="d-flex justify-content-end mb-3">
            <a href="{% url 'service_create' %}" class="btn btn-lg btn-outline-primary rounded-3">
                <i class="bi bi-plus-circle me-2"></i>Add New Service
            </a>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle text-center" style="table-layout: fixed;">
                <thead class="table-primary text-nowrap">
                    <tr>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for service in services %}
                    <tr>
                        <td class="text-truncate fw-semibold" title="{{ service.name }}">{{ service.name|default:"—" }}</td>
                        <td>
                            <a href="{% url 'service_update' service.pk %}" class="btn btn-sm btn-outline-warning me-1" title="Edit">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a href="{% url 'service_delete' service.pk %}" class="btn btn-sm btn-outline-danger" title="Delete" onclick="return confirm('Are you sure you want to delete this service?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center text-muted py-4 fs-5">No services found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
