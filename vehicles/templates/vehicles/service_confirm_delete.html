{% extends "base.html" %}
{% block title %}Confirm Delete Service{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Confirm Delete Service</h1>
<p>Are you sure you want to delete the service "{{ service.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'service_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
