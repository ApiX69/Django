{% extends "base.html" %}

{% block content %}
<div class="container mt-4 px-3">
    <div class="card shadow p-4 rounded-4 animate__animated animate__fadeInDown">
        <h2 class="mb-4 fw-bold text-center text-primary">🏢 Departments List</h2>

        <!-- Add Department Button -->
        <div class="d-flex justify-content-end mb-3">
            <a href="{% url 'department_create' %}" class="btn btn-lg btn-outline-primary rounded-3">
                <i class="bi bi-plus-circle me-2"></i>Add New Department
            </a>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle text-center" style="table-layout: fixed;">
                <thead class="table-primary text-nowrap">
                    <tr>
                        <th>Name</th>
                        <th>Fuel Card</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for department in departments %}
                    <tr>
                        <td class="text-truncate fw-semibold" title="{{ department.name }}">{{ department.name|default:"—" }}</td>
                        <td>{{ department.fuel_card.id|default:"—" }}</td>
                        <td>
                            <a href="{% url 'department_edit' department.pk %}" class="btn btn-sm btn-outline-warning me-1" title="Edit">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a href="{% url 'department_delete' department.pk %}" class="btn btn-sm btn-outline-danger" title="Delete" onclick="return confirm('Are you sure you want to delete this department?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4 fs-5">No departments found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
